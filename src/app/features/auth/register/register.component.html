<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h1>Inscription</h1>
      <p>Créez votre compte AICHA SHOP</p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="name">Nom complet</label>
        <input type="text" id="name" formControlName="name" placeholder="Votre nom">
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" formControlName="email" placeholder="votre@email.com">
      </div>

      <div class="form-group">
        <label for="phone">Téléphone (optionnel)</label>
        <input type="tel" id="phone" formControlName="phone" placeholder="+221 77 000 00 00">
      </div>

      <div class="form-group">
        <label for="role">Type de compte</label>
        <select id="role" formControlName="role">
          <option value="client">Client</option>
          <option value="vendeur">Vendeur</option>
        </select>
      </div>

      <div *ngIf="showVendorFields">
        <div class="form-group">
          <label for="shop_name">Nom de la boutique</label>
          <input type="text" id="shop_name" formControlName="shop_name" placeholder="Ma Boutique">
        </div>

        <div class="form-group">
          <label for="shop_description">Description de la boutique</label>
          <textarea id="shop_description" formControlName="shop_description" rows="3" placeholder="Décrivez votre boutique..."></textarea>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" formControlName="password" placeholder="••••••••">
        <small>Minimum 8 caractères</small>
      </div>

      <div class="form-group">
        <label for="password_confirmation">Confirmer le mot de passe</label>
        <input type="password" id="password_confirmation" formControlName="password_confirmation" placeholder="••••••••">
      </div>

      <div class="error" *ngIf="error">{{ error }}</div>

      <button type="submit" class="btn btn-primary btn-block" [disabled]="loading || registerForm.invalid">
        <span *ngIf="!loading">S'inscrire</span>
        <span *ngIf="loading">Inscription...</span>
      </button>
    </form>

    <div class="auth-footer">
      <p>Déjà un compte ? <a routerLink="/auth/login">Se connecter</a></p>
    </div>
  </div>
</div>
