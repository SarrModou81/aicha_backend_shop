<div class="seller-layout">
  <app-seller-sidebar></app-seller-sidebar>
  <div class="seller-main">
    <app-seller-navbar></app-seller-navbar>
    <div class="seller-content">
      <div class="form-container">
        <h1>{{ isEditMode ? 'Modifier' : 'Ajouter' }} un produit</h1>
        
        <form (ngSubmit)="onSubmit()" class="product-form">
          <div class="form-group">
            <label>Nom du produit *</label>
            <input type="text" [(ngModel)]="product.name" name="name" required class="form-control"/>
          </div>
          
          <div class="form-group">
            <label>Description</label>
            <textarea [(ngModel)]="product.description" name="description" rows="4" class="form-control"></textarea>
          </div>
          
          <div class="form-row">
            <div class="form-group">
              <label>Prix (FCFA) *</label>
              <input type="number" [(ngModel)]="product.price" name="price" required class="form-control"/>
            </div>
            
            <div class="form-group">
              <label>Prix promotionnel (FCFA)</label>
              <input type="number" [(ngModel)]="product.discount_price" name="discount_price" class="form-control"/>
            </div>
          </div>
          
          <div class="form-row">
            <div class="form-group">
              <label>Stock *</label>
              <input type="number" [(ngModel)]="product.stock" name="stock" required class="form-control"/>
            </div>
            
            <div class="form-group">
              <label>SKU</label>
              <input type="text" [(ngModel)]="product.sku" name="sku" class="form-control"/>
            </div>
          </div>
          
          <div class="form-group">
            <label>Marque</label>
            <input type="text" [(ngModel)]="product.brand" name="brand" class="form-control"/>
          </div>
          
          <div class="form-group">
            <label>
              <input type="checkbox" [(ngModel)]="product.is_active" name="is_active"/>
              Produit actif
            </label>
          </div>
          
          <div *ngIf="error" class="error-message">{{ error }}</div>
          
          <div class="form-actions">
            <button type="submit" class="btn btn-primary" [disabled]="loading">
              {{ loading ? 'Enregistrement...' : 'Enregistrer' }}
            </button>
            <button type="button" class="btn btn-secondary" (click)="cancel()">Annuler</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
