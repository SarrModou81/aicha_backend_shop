<div class="profile-page">
  <div class="profile-header">
    <h1>Mon Profil</h1>
  </div>

  <div *ngIf="loading" class="loading-spinner">
    <i class="fas fa-spinner fa-spin"></i> Chargement...
  </div>

  <div *ngIf="!loading" class="profile-container">
        <!-- Profile Overview Card -->
        <div class="profile-card">
          <div class="profile-avatar">
            <div class="avatar-circle">
              {{ getInitials() }}
            </div>
          </div>
          <div class="profile-info">
            <h2>{{ user?.name }}</h2>
            <p class="user-role"><i class="fas fa-store"></i> Vendeur</p>
            <p class="user-email"><i class="fas fa-envelope"></i> {{ user?.email }}</p>
            <p class="member-since"><i class="fas fa-calendar"></i> Membre depuis {{ user?.created_at | date: 'MMMM yyyy' }}</p>
          </div>
        </div>

        <!-- Profile Information Form -->
        <div class="info-card">
          <div class="card-header">
            <h3>Informations personnelles</h3>
            <button class="btn btn-secondary" (click)="toggleEditMode()">
              <i class="fas" [ngClass]="editMode ? 'fa-times' : 'fa-edit'"></i>
              {{ editMode ? 'Annuler' : 'Modifier' }}
            </button>
          </div>

          <form class="profile-form" (ngSubmit)="updateProfile()">
            <div class="form-row">
              <div class="form-group">
                <label>Nom complet</label>
                <input
                  type="text"
                  [(ngModel)]="profileForm.name"
                  name="name"
                  class="form-control"
                  [disabled]="!editMode"
                  required
                />
              </div>

              <div class="form-group">
                <label>Email</label>
                <input
                  type="email"
                  [(ngModel)]="profileForm.email"
                  name="email"
                  class="form-control"
                  [disabled]="!editMode"
                  required
                />
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label>Téléphone</label>
                <input
                  type="tel"
                  [(ngModel)]="profileForm.phone"
                  name="phone"
                  class="form-control"
                  [disabled]="!editMode"
                />
              </div>

              <div class="form-group">
                <label>Adresse</label>
                <input
                  type="text"
                  [(ngModel)]="profileForm.address"
                  name="address"
                  class="form-control"
                  [disabled]="!editMode"
                />
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label>Ville</label>
                <input
                  type="text"
                  [(ngModel)]="profileForm.city"
                  name="city"
                  class="form-control"
                  [disabled]="!editMode"
                />
              </div>

              <div class="form-group">
                <label>Pays</label>
                <input
                  type="text"
                  [(ngModel)]="profileForm.country"
                  name="country"
                  class="form-control"
                  [disabled]="!editMode"
                />
              </div>
            </div>

            <div class="form-group">
              <label>Bio</label>
              <textarea
                [(ngModel)]="profileForm.bio"
                name="bio"
                class="form-control"
                rows="4"
                [disabled]="!editMode"
                placeholder="Parlez de votre activité..."
              ></textarea>
            </div>

            <div *ngIf="editMode" class="form-actions">
              <button type="submit" class="btn btn-primary" [disabled]="saving">
                <i class="fas" [ngClass]="saving ? 'fa-spinner fa-spin' : 'fa-save'"></i>
                {{ saving ? 'Enregistrement...' : 'Enregistrer' }}
              </button>
            </div>
          </form>
        </div>

        <!-- Change Password Card -->
        <div class="info-card">
          <div class="card-header">
            <h3>Changer le mot de passe</h3>
          </div>

          <form class="profile-form" (ngSubmit)="changePassword()">
            <div class="form-group">
              <label>Mot de passe actuel</label>
              <input
                type="password"
                [(ngModel)]="passwordForm.current_password"
                name="current_password"
                class="form-control"
                required
              />
            </div>

            <div class="form-group">
              <label>Nouveau mot de passe</label>
              <input
                type="password"
                [(ngModel)]="passwordForm.password"
                name="password"
                class="form-control"
                required
                minlength="8"
              />
              <small>Le mot de passe doit contenir au moins 8 caractères</small>
            </div>

            <div class="form-group">
              <label>Confirmer le mot de passe</label>
              <input
                type="password"
                [(ngModel)]="passwordForm.password_confirmation"
                name="password_confirmation"
                class="form-control"
                required
              />
            </div>

            <div class="form-actions">
              <button type="submit" class="btn btn-primary" [disabled]="saving">
                <i class="fas" [ngClass]="saving ? 'fa-spinner fa-spin' : 'fa-key'"></i>
                {{ saving ? 'Mise à jour...' : 'Changer le mot de passe' }}
              </button>
            </div>
          </form>
        </div>
      </div>
</div>
